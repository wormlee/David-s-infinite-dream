<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05030a">
<title>INFINITE DREAM — 50 Worlds</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05030a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none}
#hud{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none;font-size:9px;letter-spacing:.16em;color:#ffffffaa;text-transform:uppercase;text-shadow:0 2px 12px #000}
#title{color:#fff}
#tip{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 72px);transform:translateX(-50%);white-space:nowrap;font-size:10px;color:#ffffff99;pointer-events:none}
#controls{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);display:flex;gap:8px}
button{appearance:none;border:1px solid #ffffff30;background:#09070dcc;color:#fff;border-radius:999px;padding:10px 13px;font-weight:700;font-size:11px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="title">INFINITE DREAM / 50 WORLDS</span><span>WORLD <b id="depth">01</b> / 50</span></div>
<div id="tip">🤏 pinch inward/outward to descend · drag to explore</div>
<div id="controls"><button id="dive">DIVE ×1</button><button id="reset">SURFACE</button></div>
<script>
const C=document.getElementById('c'),ctx=C.getContext('2d');
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
let zoom=1,px=0,py=0,points=new Map(),pinchStart=0,pinchZoom=1,drag=false,lastX=0,lastY=0,lastTap=0;
const TAU=Math.PI*2;
const pages=[
"THE BEDROOM","THE MORNING","THE WALK","THE SCHOOL GATES","THE CORRIDOR","THE LOCKERS","THE CLASSROOM","THE DESK","THE WINDOW","THE BELL",
"THE LUNCH HALL","THE LUNCH TABLE","THE LAST LESSON","THE JOURNEY HOME","THE EVENING","THE BEDROOM AGAIN","THE MIRROR","THE CRACK","BEHIND THE CRACK","THE HALL OF MIRRORS",
"THE DOOR THAT REMEMBERS","THE FOREST","THE FIRST MUSHROOM","THE GLOW","THE HIDDEN PATH","THE UNDERGROUND","THE ELF MARKET","THE MUSHROOM PARTY","THE DANCE","THE FIRE CIRCLE",
"THE MUSIC MADE VISIBLE","THE LAUGHING MOON","THE OCEAN IN A TEAR","THE CITY INSIDE A DROP","THE LIBRARY OF MEMORIES","THE ROOM OF EVERY VERSION","THE CHILD","THE FUTURE","THE END OF TIME","THE BEGINNING AGAIN",
"THE INFINITE STAIR","THE EYE IN THE WALL","THE GARDEN OF THOUGHTS","THE OCEAN OF DREAMS","THE EMPTY ROOM","THE THING BEYOND THE ROOM","THE UNIVERSE FOLDING","THE LAST MIRROR","THE FIRST THOUGHT","THE LOOP"
];

function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);C.width=W*DPR;C.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener("resize",resize);resize();

function R(n){let x=Math.sin(n*12.9898+78.233)*43758.5453123;return x-Math.floor(x)}
function HSL(seed,s=75,l=60,a=1){return `hsla(${((seed*137.508)%360+360)%360},${s}%,${l}%,${a})`}
function line(x1,y1,x2,y2,col,w=1){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function circ(x,y,r,fill,stroke,w=1){ctx.beginPath();ctx.arc(x,y,r,0,TAU);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=w;ctx.stroke()}}
function eye(x,y,s,r,col){ctx.save();ctx.translate(x,y);ctx.rotate(r);ctx.strokeStyle=col;ctx.lineWidth=Math.max(1,s*.035);ctx.beginPath();ctx.ellipse(0,0,s,s*.42,0,0,TAU);ctx.stroke();circ(0,0,s*.14,col);ctx.restore()}
function txt(t,x,y,size,alpha=.72){ctx.save();ctx.textAlign="center";ctx.font=`700 ${size}px system-ui`;ctx.fillStyle=`rgba(255,255,255,${alpha})`;ctx.fillText(t,x,y);ctx.restore()}
function poly(cx,cy,r,n,rot,col,w=1){ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();for(let i=0;i<n;i++){let a=i*TAU/n;let rr=r*(.8+.2*Math.sin(i*5.3));let x=Math.cos(a)*rr,y=Math.sin(a)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.stroke();ctx.restore()}

function stars(seed,s){
 for(let i=0;i<170;i++){let a=R(seed+i)*TAU,r=s*(.05+R(seed+i*3)*1.05);circ(Math.cos(a)*r,Math.sin(a)*r,.4+R(seed+i*8)*1.5,HSL(seed+i*7,90,82,.25+R(i+seed)*.7))}
}
function doorway(seed,x,y,w,h){
 ctx.save();ctx.translate(x,y);
 ctx.fillStyle="#020108";ctx.beginPath();ctx.ellipse(0,0,w,h,0,0,TAU);ctx.fill();
 ctx.strokeStyle=HSL(seed,100,78,.95);ctx.lineWidth=Math.max(2,w*.025);ctx.stroke();
 for(let i=1;i<5;i++){ctx.strokeStyle=HSL(seed+i*17,100,70,.4);ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(0,0,w*i/5,h*i/5,0,0,TAU);ctx.stroke()}
 ctx.restore();
}
function human(seed,x,y,s,pose=0){
 ctx.save();ctx.translate(x,y);
 ctx.strokeStyle=HSL(seed,70,78,.8);ctx.fillStyle=HSL(seed+9,70,38,.8);ctx.lineWidth=Math.max(1,s*.05);
 circ(0,-s*.72,s*.22,ctx.fillStyle);ctx.fillRect(-s*.16,-s*.5,s*.32,s*.75);
 if(pose===1){line(-s*.15,-s*.25,-s*.65,0,ctx.strokeStyle,s*.06);line(s*.15,-s*.25,s*.65,0,ctx.strokeStyle,s*.06)}
 else {line(-s*.12,s*.2,-s*.42,s*.72,ctx.strokeStyle,s*.06);line(s*.12,s*.2,s*.42,s*.72,ctx.strokeStyle,s*.06)}
 ctx.restore();
}

function school(seed,s,kind){
 ctx.fillStyle="#111019";ctx.fillRect(-s,-s,s*2,s*2);
 // architecture
 ctx.fillStyle=HSL(seed,45,18,.95);ctx.fillRect(-s*.8,-s*.42,s*1.6,s*.84);
 for(let i=-5;i<=5;i++){let xx=i*s*.13;ctx.fillStyle=HSL(seed+i,60,35,.7);ctx.fillRect(xx-s*.04,-s*.3,s*.08,s*.22)}
 // floor perspective
 ctx.strokeStyle=HSL(seed+30,80,60,.22);ctx.lineWidth=1;
 for(let i=-8;i<=8;i++)line(i*s*.1,-s*.05,i*s*.5,s*.55,ctx.strokeStyle);
 for(let i=0;i<7;i++)line(-s*.8,-s*.05+i*s*.09,s*.8,-s*.05+i*s*.09,ctx.strokeStyle);
 // lockers
 for(let i=-8;i<=8;i++){let xx=i*s*.085;ctx.fillStyle=HSL(seed+i*3,55,30,.7);ctx.fillRect(xx,-s*.33,s*.065,s*.52);line(xx+s*.012,-s*.2,xx+s*.05,-s*.2,HSL(seed+i,70,80,.3))}
 // tiny students
 for(let i=0;i<15;i++)human(seed+i*9,(R(seed+i)*2-1)*s*.7,s*.12+R(seed+i+40)*s*.25,s*.045,(i%3===0)?1:0);
 if(kind===0){txt("A MEMORY IS NOT A PHOTOGRAPH",0,s*.43,s*.026,.6)}
 if(kind===1){txt("SAME HALLWAY. DIFFERENT UNIVERSE.",0,s*.43,s*.025,.6)}
}
function food(seed,s){
 ctx.fillStyle=HSL(seed,55,9,.95);ctx.fillRect(-s,-s,s*2,s*2);
 ctx.fillStyle="#20140f";ctx.fillRect(-s*.7,-s*.18,s*1.4,s*.32);
 for(let i=0;i<8;i++){let x=(i-3.5)*s*.16;circ(x,-s*.06,s*.055,HSL(seed+i*17,75,55,.8));}
 human(seed+9,-s*.35,-s*.12,s*.13,1);human(seed+19,s*.35,-s*.12,s*.13,1);
 // food fractals
 for(let i=0;i<18;i++){let a=R(seed+i)*TAU,r=s*(.06+R(i+seed)*.22);circ(Math.cos(a)*r,Math.sin(a)*r,s*.018,HSL(seed+i*11,95,70,.8))}
 txt("TASTE BECOMES A MEMORY",0,s*.48,s*.027,.65);
}
function mirror(seed,s,cracked){
 ctx.fillStyle="#0a0b12";ctx.fillRect(-s,-s,s*2,s*2);
 // room
 ctx.strokeStyle=HSL(seed,50,60,.35);ctx.lineWidth=2;ctx.strokeRect(-s*.72,-s*.8,s*1.44,s*1.6);
 doorway(seed+5,0,0,s*.48,s*.72);
 // figure
 human(seed+2,0,s*.18,s*.3,0);
 // mirror surface
 ctx.fillStyle="rgba(20,30,45,.55)";ctx.fillRect(-s*.36,-s*.62,s*.72,s*1.18);
 for(let i=0;i<7;i++){eye(seed+i,-s*.2+(i%4)*s*.14,-s*.05+s*.0,i*.2,HSL(seed+i*21,90,78,.65))}
 if(cracked){
  ctx.strokeStyle="#ffffffcc";ctx.lineWidth=Math.max(1,s*.012);
  for(let i=0;i<13;i++){let a=R(seed+i)*TAU,rr=s*(.1+R(seed+i*4)*.55);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);ctx.stroke()}
  doorway(seed+90,0,0,s*.17,s*.28);
 }
 txt(cracked?"THE CRACK IS A DOOR":"WHO IS LOOKING?",0,s*.48,s*.03,.72);
}
function forest(seed,s,party=false){
 let g=ctx.createRadialGradient(0,0,0,0,0,s);g.addColorStop(0,HSL(seed,80,25,.95));g.addColorStop(1,"#020307");ctx.fillStyle=g;ctx.fillRect(-s,-s,s*2,s*2);
 // giant mushrooms
 for(let i=0;i<15;i++){let x=(R(seed+i)*2-1)*s*.78,y=(R(seed+i+20)*2-1)*s*.65,m=s*(.07+R(seed+i+50)*.11);ctx.strokeStyle=HSL(seed+i*13,90,70,.8);ctx.lineWidth=m*.15;line(x,y,x,y+m*1.8,ctx.strokeStyle,ctx.lineWidth);ctx.fillStyle=HSL(seed+i*29,90,55,.8);ctx.beginPath();ctx.ellipse(x,y,m,m*.45,0,Math.PI,TAU);ctx.fill();for(let q=0;q<4;q++)circ(x+(R(i+q)*2-1)*m*.5,y-m*.08,R(q+seed)*m*.06,HSL(seed+q*31,100,85,.9))}
 // trees
 for(let i=0;i<12;i++){let x=(R(seed+i*7)*2-1)*s*.9;line(x,s*.45,x,-s*.65,HSL(seed+i,65,28,.9),s*.035);for(let q=0;q<5;q++)circ(x+(R(seed+i+q)*2-1)*s*.08,-s*.45+q*s*.12,s*.13,HSL(seed+i+q,70,32,.65))}
 if(party){
  for(let i=0;i<18;i++){let x=(R(seed+i*5)*2-1)*s*.7,y=(R(seed+i*7)*2-1)*s*.35;human(seed+i*17,x,y,s*.11,1);circ(x,y-s*.12,s*.035,HSL(seed+i*23,100,70,.9));}
  // fire
  for(let i=0;i<18;i++){let a=R(seed+i)*TAU,r=s*.14;circ(Math.cos(a)*r,Math.sin(a)*r,s*.025,HSL(seed+i*15,100,65,.8))}
  txt("WELCOME TO THE PARTY",0,s*.46,s*.032,.8);
 }
}
function cosmic(seed,s,mode){
 let g=ctx.createRadialGradient(0,0,0,0,0,s);g.addColorStop(0,HSL(seed,95,30,.95));g.addColorStop(.45,HSL(seed+80,75,12,.95));g.addColorStop(1,"#010107");ctx.fillStyle=g;ctx.fillRect(-s,-s,s*2,s*2);
 stars(seed,s);
 for(let i=0;i<12;i++){let a=i*TAU/12+seed*.02,r=s*(.1+i*.055);poly(0,0,r,5,a,HSL(seed+i*29,95,72,.38),1)}
 for(let i=0;i<10;i++){let a=R(seed+i)*TAU,r=s*(.2+R(seed+i*3)*.65);circ(Math.cos(a)*r,Math.sin(a)*r,s*(.018+R(i)*.035),HSL(seed+i*13,90,55,.65),HSL(seed+i*17,100,80,.7),1)}
 if(mode===1){txt("THERE IS NO EDGE",0,s*.45,s*.035,.75)}
 if(mode===2){txt("YOU ARE INSIDE THE THOUGHT",0,s*.45,s*.03,.75)}
}
function library(seed,s){
 ctx.fillStyle="#120d16";ctx.fillRect(-s,-s,s*2,s*2);
 for(let side=-1;side<=1;side+=2){for(let i=0;i<9;i++){let y=-s*.6+i*s*.14;ctx.fillStyle=HSL(seed+i*side*13,55,25,.85);ctx.fillRect(side*s*.35,y,s*.22,s*.1);}}
 for(let i=0;i<30;i++){let x=(R(seed+i)*2-1)*s*.75,y=(R(seed+i+40)*2-1)*s*.7;ctx.strokeStyle=HSL(seed+i*8,80,70,.45);ctx.beginPath();ctx.arc(x,y,s*.025,0,TAU);ctx.stroke()}
 doorway(seed+88,0,0,s*.12,s*.2);txt("EVERY MEMORY IS A ROOM",0,s*.48,s*.03,.72);
}
function generic(seed,s,label){
 cosmic(seed,s,0);
 for(let i=0;i<28;i++){let a=R(seed+i)*TAU,r=s*(.1+R(seed+i+50)*.75),x=Math.cos(a)*r,y=Math.sin(a)*r;eye(seed+i,x,y,s*.012,a,HSL(seed+i*7,100,78,.55))}
 txt(label,0,s*.47,s*.027,.62);
}

function drawPage(p,level,s){
 ctx.save();
 const seed=9001+level*7919;
 if(level<=3)generic(seed,s,p);
 else if(level<=9)school(seed,s,level%2);
 else if(level<=11)food(seed,s);
 else if(level<=15)generic(seed,s,p);
 else if(level===16)mirror(seed,s,false);
 else if(level===17)mirror(seed,s,true);
 else if(level===18)mirror(seed+8,s,true);
 else if(level<=19)mirror(seed+18,s,true);
 else if(level===20){generic(seed,s,p);doorway(seed+3,0,0,s*.18,s*.3)}
 else if(level===21)forest(seed,s,false);
 else if(level===22)forest(seed,s,false);
 else if(level===23)forest(seed,s,false);
 else if(level===24)forest(seed,s,false);
 else if(level===25)forest(seed,s,false);
 else if(level===26)forest(seed,s,true);
 else if(level===27)forest(seed,s,true);
 else if(level===28)forest(seed+10,s,true);
 else if(level===29)forest(seed+20,s,true);
 else if(level<=34)cosmic(seed,s,level%3);
 else if(level===35)library(seed,s);
 else if(level<=39)generic(seed,s,p);
 else if(level===40)generic(seed,s,p);
 else if(level===41)generic(seed+20,s,p);
 else if(level===42)cosmic(seed,s,2);
 else if(level===43)generic(seed,s,p);
 else if(level===44)generic(seed,s,p);
 else if(level===45)cosmic(seed,s,1);
 else if(level===46)mirror(seed+44,s,true);
 else if(level===47)cosmic(seed,s,2);
 else if(level===48)generic(seed,s,"THE FIRST THOUGHT");
 else if(level===49)cosmic(seed,s,1);

 // Every page has a physical portal into the next page.
 if(level<49){
   ctx.save();
   const pr=s*.105;
   ctx.fillStyle="#020108";ctx.beginPath();ctx.ellipse(0,0,pr*.7,pr,0,0,TAU);ctx.fill();
   ctx.strokeStyle=HSL(seed+33,100,78,.95);ctx.lineWidth=Math.max(2,s*.012);ctx.stroke();
   ctx.restore();
   // Tiny preview of next world inside the portal.
   ctx.save();ctx.beginPath();ctx.ellipse(0,0,pr*.67,pr*.96,0,0,TAU);ctx.clip();
   drawPage(pages[level+1],level+1,pr*.72);
   ctx.restore();
 } else {
   doorway(seed+99,0,0,s*.12,s*.18);
 }
 ctx.restore();
}

function render(){
 ctx.clearRect(0,0,W,H);
 const view=Math.min(W,H)*.64;
 ctx.save();ctx.translate(W/2+px,H/2+py);ctx.scale(zoom,zoom);
 // Render the current page with the next 50 pages recursively nested.
 // Because each portal contains the next page, zooming reveals the next artwork.
 drawPage(pages[0],0,view);
 ctx.restore();
 const d=Math.max(0,Math.min(49,Math.floor(Math.log(Math.max(1,zoom))/Math.log(1.9))));
 document.getElementById("depth").textContent=String(d+1).padStart(2,"0");
 requestAnimationFrame(render);
}
requestAnimationFrame(render);

// Mouse wheel for computers
C.addEventListener("wheel",e=>{e.preventDefault();zoom*=Math.exp(-e.deltaY*.0017);zoom=Math.max(.72,Math.min(1e95,zoom))},{passive:false});

// Native iPhone touch controls.
C.addEventListener("touchstart",e=>{
 e.preventDefault();
 for(const t of e.changedTouches)points.set(t.identifier,[t.clientX,t.clientY]);
 if(points.size===1){const t=e.changedTouches[0];drag=true;lastX=t.clientX;lastY=t.clientY}
 if(points.size===2){const a=[...points.values()];pinchStart=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);pinchZoom=zoom;drag=false}
 const now=Date.now();
 if(points.size===1 && now-lastTap<300)zoom*=Math.pow(1.9,4);
 lastTap=now;
},{passive:false});

C.addEventListener("touchmove",e=>{
 e.preventDefault();
 for(const t of e.changedTouches)points.set(t.identifier,[t.clientX,t.clientY]);
 if(points.size===1 && drag){const t=e.changedTouches[0];px+=t.clientX-lastX;py+=t.clientY-lastY;lastX=t.clientX;lastY=t.clientY}
 if(points.size>=2){
   const a=[...points.values()].slice(0,2),d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);
   if(pinchStart)zoom=Math.max(.72,Math.min(1e95,pinchZoom*d/pinchStart));
 }
},{passive:false});

function endTouch(e){for(const t of e.changedTouches)points.delete(t.identifier);if(points.size===0){drag=false;pinchStart=0}}
C.addEventListener("touchend",endTouch,{passive:false});C.addEventListener("touchcancel",()=>{points.clear();drag=false;pinchStart=0},{passive:false});

document.getElementById("dive").onclick=()=>zoom*=1.9;
document.getElementById("reset").onclick=()=>{zoom=1;px=py=0};
</script>
</body>
</html>
